<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Preparing Discord</title>
  <style>
    :root {
      --bg: #1e1f22;
      --text: #f2f3f5;
      --muted: #b5bac1;
      --accent: #5865f2;
      --danger: #ed4245;
      --ok: #23a559;
      --track: #2b2d31;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.45 "gg sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
      overflow: hidden;
      user-select: none;
    }
    .wrap {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 28px 24px;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }
    .status {
      color: var(--muted);
      min-height: 1.4em;
      max-width: 28em;
    }
    .status.error { color: var(--danger); }
    .status.ok { color: var(--ok); }
    .bar {
      width: min(280px, 70vw);
      height: 6px;
      border-radius: 999px;
      background: var(--track);
      overflow: hidden;
    }
    .bar > i {
      display: block;
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: inherit;
      transition: width 160ms ease;
    }
    .bar.indeterminate > i {
      width: 40%;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(280%); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Preparing Discord</h1>
    <p class="status" id="status">Checking Ghostty…</p>
    <div class="bar indeterminate" id="bar"><i id="fill"></i></div>
  </div>
  <script>
    (function () {
      const statusEl = document.getElementById('status');
      const bar = document.getElementById('bar');
      const fill = document.getElementById('fill');

      function setStatus(text, kind) {
        statusEl.textContent = text || '';
        statusEl.classList.remove('error', 'ok');
        if (kind) statusEl.classList.add(kind);
      }

      function setProgress(percent) {
        if (percent == null || !Number.isFinite(percent)) {
          bar.classList.add('indeterminate');
          fill.style.width = '40%';
          return;
        }
        bar.classList.remove('indeterminate');
        fill.style.width = Math.max(0, Math.min(100, percent)) + '%';
      }

      function bind() {
        if (!window.AtriumPlugin) {
          setTimeout(bind, 50);
          return;
        }
        window.AtriumPlugin.on('prep-status', (data) => {
          const d = data || {};
          if (d.text) setStatus(d.text, d.kind || null);
          if ('percent' in d) setProgress(d.percent);
        });
      }
      bind();
    })();
  </script>
</body>
</html>
