<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atrium Stage Footer</title>
  <link rel="stylesheet" href="lotus-resource://localhost/ui/theme.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body {
      width: 100%; height: 100%;
      background: transparent !important;
      overflow: hidden;
      font-family: var(--atrium-font-sans);
      color: var(--atrium-text);
    }
    body.game-mode .bar { display: none !important; }
    .bar {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 16px;
      background: var(--atrium-bg);
      border: 1px solid var(--atrium-accent-border);
      border-top: 1px solid var(--atrium-border-subtle);
      /* Square bottom — docks hang from these corners; only docks round below. */
      border-radius: 0;
      box-shadow: var(--atrium-highlight-top);
      backdrop-filter: var(--atrium-blur);
      -webkit-backdrop-filter: var(--atrium-blur);
      pointer-events: none;
      transition: border-color var(--atrium-motion-accent);
      animation: atrium-rise 180ms ease;
    }
    @keyframes atrium-rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .game {
      font-size: var(--atrium-text-secondary);
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 28%;
    }
    .summary {
      flex: 1 1 auto;
      min-width: 0;
      font-size: var(--atrium-text-secondary);
      color: var(--atrium-text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: var(--atrium-font-mono);
      font-variant-numeric: tabular-nums;
    }
    .pace {
      flex: 0 0 auto;
      font-size: var(--atrium-text-secondary);
      font-weight: 700;
      color: var(--atrium-accent);
      font-family: var(--atrium-font-mono);
    }
  </style>
</head>
<body class="game-mode" data-accent="perf">
  <div class="bar" id="bar">
    <div class="game" id="game">—</div>
    <div class="summary" id="summary">—</div>
    <div class="pace" id="pace">—</div>
  </div>
  <script>
    let mode = 'game';
    let status = {};
    let game = 'game';
    let accent = 'perf';

    function pacingLabel(policy, hz) {
      if (!policy) return hz ? Math.round(hz) + 'Hz' : '—';
      const p = String(policy);
      const hzBit = hz && Number(hz) > 0 ? Math.round(Number(hz)) + 'Hz ' : '';
      if (p === 'FixedVsyncLocked') return hzBit + 'FIXED';
      if (p === 'VrrPassthrough') return 'VRR';
      return hzBit + p;
    }

    function scalerSummary(st) {
      const up = st.upscale || 'OFF';
      const gw = st.width, gh = st.height;
      const hw = st.hostWidth, hh = st.hostHeight;
      let res = '';
      if (gw && gh && hw && hh && (gw !== hw || gh !== hh)) {
        res = ` · ${gw}×${gh} to ${hw}×${hh}`;
      } else if (gw && gh) {
        res = ` · ${gw}×${gh}`;
      }
      return up + res;
    }

    function render() {
      document.body.classList.toggle('game-mode', mode === 'game');
      document.body.setAttribute('data-accent', accent || 'perf');
      document.getElementById('game').textContent = game || '—';
      document.getElementById('summary').textContent = scalerSummary(status);
      document.getElementById('pace').textContent = pacingLabel(
        status.pacing,
        status.refreshHz
      );
    }

    function onShellChrome(d) {
      d = d || {};
      if (d.mode) mode = d.mode;
      if (d.status) status = d.status;
      if (d.game) game = d.game;
      if (d.accent) accent = d.accent;
      render();
    }
    window.addEventListener('atrium-shell-chrome', (e) => onShellChrome(e.detail));
    const eventSource = window.lotus?.on
      ? window.lotus
      : window.lotus?.ipc?.on
        ? window.lotus.ipc
        : null;
    if (eventSource) eventSource.on('atrium-shell-chrome', onShellChrome);
    render();
  </script>
</body>
</html>
