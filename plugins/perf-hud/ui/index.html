<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body {
      width: 100%; height: 100%;
      background: transparent !important;
      font-family: "JetBrains Mono", "SF Mono", ui-monospace, monospace;
      color: #e2e8f0;
      overflow: hidden;
    }
    .hud {
      margin: 0;
      min-width: 200px;
      max-height: 100%;
      padding: 8px 10px;
      background: rgba(8, 12, 20, 0.72);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 7px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .hero {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
    }
    .fps {
      font-size: 30px; font-weight: 800; color: #4ade80; line-height: 1;
      text-shadow: 0 0 12px rgba(74, 222, 128, 0.35);
    }
    .fps.waiting { color: #64748b; font-size: 16px; font-weight: 600; }
    .hero-right {
      text-align: right;
      line-height: 1.2;
    }
    .ft { color: #f8fafc; font-size: 12px; font-weight: 600; }
    .unit { color: #94a3b8; font-size: 9px; text-transform: uppercase; letter-spacing: 0.05em; }
    .grid {
      margin-top: 6px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2px 12px;
    }
    .cell { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
    .label { color: #94a3b8; font-size: 9px; text-transform: uppercase; letter-spacing: 0.05em; }
    .value { color: #f8fafc; font-size: 11px; font-weight: 600; }
    .hint {
      margin-top: 3px;
      color: #64748b;
      font-size: 8px;
      letter-spacing: 0.02em;
      flex-shrink: 0;
    }
    .graph {
      margin-top: 6px;
      height: 34px;
      min-height: 28px;
      flex: 1 1 auto;
      background: rgba(15, 23, 42, 0.8); border-radius: 4px;
      overflow: hidden; border: 1px solid rgba(255,255,255,0.06);
    }
    .hero, .grid { flex-shrink: 0; }
    canvas { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <div class="hud">
    <div class="hero">
      <div class="fps waiting" id="fps">—</div>
      <div class="hero-right">
        <div class="ft" id="ft">—</div>
        <div class="unit">frame · ms</div>
      </div>
    </div>
    <div class="grid">
      <div class="cell"><span class="label">P99</span><span class="value" id="low1">—</span></div>
      <div class="cell"><span class="label">P999</span><span class="value" id="low01">—</span></div>
      <div class="cell"><span class="label">CPU</span><span class="value" id="cpu">—</span></div>
      <div class="cell"><span class="label">RAM</span><span class="value" id="ram">—</span></div>
      <div class="cell" id="ramSplitRow" style="grid-column: 1 / -1; display: none">
        <span class="label">Pool</span><span class="value" id="ramSplit">—</span>
      </div>
      <div class="cell" style="grid-column: 1 / -1">
        <span class="label">Surf</span><span class="value" id="res">—</span>
      </div>
    </div>
    <div class="hint">P99 / P999 = FPS of the slowest 1% / 0.1% of frames</div>
    <div class="graph"><canvas id="ft-canvas"></canvas></div>
  </div>
  <script>
    const fpsEl = document.getElementById('fps');
    const ftEl = document.getElementById('ft');
    const low1El = document.getElementById('low1');
    const low01El = document.getElementById('low01');
    const cpuEl = document.getElementById('cpu');
    const ramEl = document.getElementById('ram');
    const ramSplitRow = document.getElementById('ramSplitRow');
    const ramSplitEl = document.getElementById('ramSplit');
    const resEl = document.getElementById('res');
    const canvas = document.getElementById('ft-canvas');
    const g = canvas.getContext('2d');
    const HISTORY = 90;
    const frameHistory = new Array(HISTORY).fill(0);
    let hasFrames = false;

    function fmtFps(n) {
      if (n == null || !Number.isFinite(Number(n))) return '—';
      return Math.round(Number(n)) + ' fps';
    }

    function fmtMb(mb) {
      const n = Number(mb);
      if (!Number.isFinite(n) || n < 0) return '—';
      if (n >= 1024) return (n / 1024).toFixed(1) + 'G';
      return Math.round(n) + 'M';
    }

    function fmtRam(usedMb, totalMb) {
      if (usedMb == null || totalMb == null) return '—';
      const u = Number(usedMb);
      const t = Number(totalMb);
      if (!(t > 0)) return '—';
      return fmtMb(u) + '/' + fmtMb(t);
    }

    function fmtPoolSplit(stats) {
      if (!stats || !stats.ram_uma) return null;
      return 'sys ' + fmtMb(stats.ram_sys_mb) + ' · gpu ' + fmtMb(stats.ram_gpu_mb);
    }

    function resizeCanvas() {
      canvas.width = Math.max(1, canvas.clientWidth * devicePixelRatio);
      canvas.height = Math.max(1, canvas.clientHeight * devicePixelRatio);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function updateLiveStats(stats) {
      if (!stats) return;
      if (stats.fps != null && Number(stats.fps) > 0) {
        hasFrames = true;
        fpsEl.classList.remove('waiting');
        fpsEl.textContent = Math.round(Number(stats.fps));
      }
      if (stats.frametime_ms != null && Number(stats.frametime_ms) > 0) {
        const ft = Number(stats.frametime_ms);
        ftEl.textContent = ft.toFixed(2);
        frameHistory.push(ft);
        if (frameHistory.length > HISTORY) frameHistory.shift();
        hasFrames = true;
      }
      if (stats.fps_1_low != null) low1El.textContent = fmtFps(stats.fps_1_low);
      if (stats.fps_01_low != null) low01El.textContent = fmtFps(stats.fps_01_low);
      if (stats.cpu_pct != null) {
        cpuEl.textContent = Number(stats.cpu_pct).toFixed(0) + '%';
      }
      if (stats.ram_used_mb != null && stats.ram_total_mb != null) {
        ramEl.textContent = fmtRam(stats.ram_used_mb, stats.ram_total_mb);
      }
      const split = fmtPoolSplit(stats);
      if (split) {
        ramSplitRow.style.display = '';
        ramSplitEl.textContent = split;
      } else {
        ramSplitRow.style.display = 'none';
      }
      if (stats.width && stats.height) {
        let s = stats.width + '×' + stats.height;
        if (stats.refresh_hz != null && Number(stats.refresh_hz) > 0) {
          s += ' @' + Math.round(Number(stats.refresh_hz)) + 'Hz';
        }
        if (stats.fps_ingest != null && Number(stats.fps_ingest) > 0) {
          s += ' · in ' + Math.round(Number(stats.fps_ingest));
        }
        if (stats.commits_per_swap != null && Number(stats.commits_per_swap) > 1.05) {
          s += ' · ×' + Number(stats.commits_per_swap).toFixed(1);
        }
        if (stats.pacing_policy) {
          const p = String(stats.pacing_policy);
          s +=
            ' · ' +
            (p === 'FixedVsyncLocked'
              ? 'Fixed'
              : p === 'VrrPassthrough'
                ? 'VRR'
                : p);
        }
        if (stats.soft_fifo) s += '+SF';
        if (stats.hold_cadence) s += '+hold';
        resEl.textContent = s;
      }
    }

    let rafPending = false;
    function renderGraph() {
      rafPending = false;
      const w = canvas.width, h = canvas.height;
      g.clearRect(0, 0, w, h);
      if (hasFrames) {
        g.strokeStyle = '#38bdf8';
        g.lineWidth = 1.5 * devicePixelRatio;
        g.beginPath();
        const step = w / (HISTORY - 1);
        for (let i = 0; i < frameHistory.length; i++) {
          const ft = frameHistory[i] || 0;
          const y = h - Math.min(h, (ft / 33.3) * h);
          const x = i * step;
          if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
        }
        g.stroke();
      }
      scheduleGraph();
    }
    function scheduleGraph() {
      if (rafPending) return;
      rafPending = true;
      requestAnimationFrame(renderGraph);
    }
    scheduleGraph();

    window.addEventListener('plugin:perf-hud:stats', (e) => updateLiveStats(e.detail));
    window.addEventListener('atrium-pane-shown', () => {
      scheduleGraph();
    });
    const waitPlugin = setInterval(() => {
      if (window.AtriumPlugin) {
        clearInterval(waitPlugin);
        window.AtriumPlugin.on('stats', updateLiveStats);
      }
    }, 100);
  </script>
</body>
</html>
