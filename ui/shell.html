<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atrium Shell</title>
  <link rel="stylesheet" href="lotus-resource://localhost/ui/theme.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent !important;
      overflow: hidden;
      font-family: var(--atrium-font-sans);
      color: var(--atrium-text);
    }
    body.game-mode .chrome { display: none !important; }
    .chrome {
      position: absolute;
      top: 0;
      left: 0;
      width: max-content;
      max-width: 100%;
      height: auto;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      padding: 6px 10px;
      background: var(--atrium-bg);
      border: 1px solid var(--atrium-border);
      border-radius: var(--atrium-radius);
      box-shadow: var(--atrium-highlight-top);
      pointer-events: auto;
    }
    .dock-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      width: max-content;
      max-width: 100%;
    }
    .bump {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      height: 22px;
      padding: 0 6px;
      border-radius: 5px;
      font-family: var(--atrium-font-mono);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--atrium-text-muted);
      background: rgba(0,0,0,0.35);
      border: 1px solid var(--atrium-border-subtle);
    }
    .dock-slots {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
      width: max-content;
    }
    .tab {
      appearance: none;
      border: 1px solid transparent;
      background: transparent;
      color: var(--atrium-text-muted);
      border-radius: var(--atrium-radius-sm);
      padding: 6px 10px;
      font: inherit;
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
      white-space: nowrap;
      position: relative;
    }
    .tab:hover { color: var(--atrium-text); background: rgba(255,255,255,0.04); }
    .tab.active {
      color: var(--atrium-primary);
      background: var(--atrium-primary-soft);
      border-color: rgba(52, 211, 153, 0.35);
      box-shadow: var(--atrium-highlight-top);
    }
    .tab.active::after {
      content: "";
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 0;
      height: 2px;
      border-radius: 2px 2px 0 0;
      background: var(--atrium-primary);
    }
  </style>
</head>
<body class="game-mode">
  <div class="chrome" id="chrome">
    <div class="dock-row">
      <span class="bump" title="Previous tab">F7</span>
      <div class="dock-slots" id="dockSlots"></div>
      <span class="bump" title="Next tab">F8</span>
    </div>
  </div>
  <script>
    const dockSlotsEl = document.getElementById('dockSlots');
    let mode = 'game';
    let dock = [];
    let lastDockSig = '';

    function lotusIpc() {
      return window.lotus?.ipc || window.lotus || null;
    }

    function dockSignature(list) {
      return (list || []).map((s) => s.key + '\0' + (s.label || '')).join('\n');
    }

    function renderDock() {
      const sig = dockSignature(dock);
      if (sig === lastDockSig) {
        const kids = dockSlotsEl.children;
        for (let i = 0; i < dock.length; i++) {
          if (kids[i]) kids[i].classList.toggle('active', !!dock[i].active);
        }
        return;
      }
      lastDockSig = sig;
      dockSlotsEl.innerHTML = '';
      for (const s of dock) {
        const el = document.createElement('button');
        el.type = 'button';
        el.className = 'tab' + (s.active ? ' active' : '');
        el.textContent = s.label || s.key;
        el.addEventListener('click', (ev) => {
          ev.preventDefault();
          ev.stopPropagation();
          const ipc = lotusIpc();
          if (ipc?.send) ipc.send('atrium-shell-button', 'dock:' + s.key);
        });
        dockSlotsEl.appendChild(el);
      }
    }

    function reportShellMetrics() {
      const chrome = document.getElementById('chrome');
      const ipc = lotusIpc();
      if (!chrome || !ipc?.send || mode === 'game') return;
      const r = chrome.getBoundingClientRect();
      const width = Math.ceil(r.width);
      const height = Math.ceil(r.height);
      if (width < 80 || height < 20) return;
      ipc.send('atrium-shell-metrics', { kind: 'dock', width, height });
    }

    function render() {
      document.body.classList.toggle('game-mode', mode === 'game');
      renderDock();
      requestAnimationFrame(() => requestAnimationFrame(reportShellMetrics));
    }

    function onShellChrome(d) {
      d = d || {};
      if (d.mode) mode = d.mode;
      if (Array.isArray(d.dock)) dock = d.dock;
      render();
    }
    window.addEventListener('atrium-shell-chrome', (e) => onShellChrome(e.detail));

    const eventSource = window.lotus?.on ? window.lotus
      : (window.lotus?.ipc?.on ? window.lotus.ipc : null);
    if (eventSource) {
      eventSource.on('atrium-shell-chrome', onShellChrome);
      eventSource.on('atrium-game-stats', (stats) => {
        const ipc = lotusIpc();
        if (ipc?.send) ipc.send('atrium-forward-stats', stats);
      });
      eventSource.on('atrium-notify', (payload) => {
        const ipc = lotusIpc();
        if (ipc?.send) ipc.send('atrium-notify', payload || {});
      });
      eventSource.on('atrium-notify-closed', (payload) => {
        const ipc = lotusIpc();
        if (ipc?.send) ipc.send('atrium-notify-closed', payload || {});
      });
      eventSource.on('atrium-notify-action', (payload) => {
        const ipc = lotusIpc();
        if (ipc?.send) ipc.send('atrium-notify-action', payload || {});
      });
      // nest-hotkey / nest-controller-action arrive on Node via push_host_ipc
      // (no Servo round-trip). Keep other nest:* channels on the renderer bus.
      eventSource.on('nest:external-exit', (data) => {
        const ipc = lotusIpc();
        if (ipc?.send) ipc.send('nest-external-exit', data || {});
      });
      eventSource.on('nest:game-mode', (data) => {
        const ipc = lotusIpc();
        if (ipc?.send) ipc.send('atrium-forward-mode', data);
        if (data && data.game_mode !== undefined) {
          mode = data.game_mode ? 'game' : 'overlay';
          render();
        }
      });
      eventSource.on('nest:fullscreen', (data) => {
        const ipc = lotusIpc();
        if (ipc?.send && data && data.fullscreen !== undefined) {
          ipc.send('atrium-forward-fullscreen', !!data.fullscreen);
        }
      });
    }

    try {
      const ipc = lotusIpc();
      if (ipc && typeof ipc._connectWs === 'function') ipc._connectWs();
    } catch (e) {}
    render();
  </script>
</body>
</html>
