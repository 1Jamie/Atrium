<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atrium Tab Cluster</title>
  <link rel="stylesheet" href="lotus-resource://localhost/ui/theme.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body {
      width: 100%; height: 100%;
      background: transparent !important;
      overflow: hidden;
      font-family: var(--atrium-font-sans);
      color: var(--atrium-text);
    }
    body.game-mode .cluster { display: none !important; }
    .cluster {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--atrium-bg);
      border: 1px solid var(--atrium-accent-border);
      border-top: none;
      border-radius: 0 0 var(--atrium-radius) var(--atrium-radius);
      box-shadow: var(--atrium-highlight-top);
      backdrop-filter: var(--atrium-blur);
      -webkit-backdrop-filter: var(--atrium-blur);
      overflow: hidden;
      pointer-events: auto;
      transition: border-color var(--atrium-motion-accent);
    }
    .row {
      appearance: none;
      flex: 1 1 0;
      min-height: 48px;
      border: 0;
      border-bottom: 1px solid var(--atrium-border-subtle);
      background: transparent;
      color: var(--atrium-text-muted);
      font: inherit;
      font-size: var(--atrium-text-secondary);
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      text-align: left;
      position: relative;
      transition: background 0.12s ease, color 0.12s ease, transform 0.1s ease;
    }
    .row:last-child { border-bottom: 0; }
    .row:hover:not(:disabled) { color: var(--atrium-text); background: rgba(255,255,255,0.04); }
    .row:active:not(:disabled) { transform: scale(0.97); }
    .row.active {
      color: var(--atrium-accent);
      background: var(--atrium-accent-soft);
    }
    .row.active::before {
      content: "";
      position: absolute;
      left: 0;
      top: 10px;
      bottom: 10px;
      width: 3px;
      border-radius: 0 2px 2px 0;
      background: var(--atrium-accent);
    }
    .row .icon {
      width: 22px;
      text-align: center;
      font-size: 16px;
      flex: 0 0 auto;
      opacity: 0.9;
    }
    .row .label {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .row.empty {
      visibility: hidden;
      pointer-events: none;
      border: 0;
    }
    .pager {
      flex: 1 1 0;
      min-height: 48px;
      display: flex;
      align-items: stretch;
      border-bottom: 0;
    }
    .pager button {
      appearance: none;
      flex: 1 1 0;
      border: 0;
      border-right: 1px solid var(--atrium-border-subtle);
      background: transparent;
      color: var(--atrium-text);
      font: inherit;
      font-size: 22px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.12s ease, color 0.12s ease, transform 0.1s ease;
    }
    .pager button:last-child { border-right: 0; }
    .pager button:hover:not(:disabled) { background: rgba(255,255,255,0.04); }
    .pager button:active:not(:disabled) { transform: scale(0.97); }
    .pager button:disabled {
      color: var(--atrium-text-dim);
      opacity: 0.35;
      cursor: default;
    }
  </style>
</head>
<body class="game-mode" data-accent="perf">
  <div class="cluster" id="cluster"></div>
  <script>
    const clusterEl = document.getElementById('cluster');
    let mode = 'game';
    let nav = { page: 0, pages: 1, rows: [] };
    let accent = 'perf';

    function lotusIpc() {
      return window.lotus?.ipc || window.lotus || null;
    }

    function iconFor(label) {
      const s = String(label || '').toLowerCase();
      if (s.includes('chat') || s.includes('discord')) return '💬';
      if (s.includes('scal')) return '◈';
      if (s.includes('perf')) return '◉';
      if (s.includes('sign')) return '✎';
      return '▣';
    }

    function render() {
      document.body.classList.toggle('game-mode', mode === 'game');
      document.body.setAttribute('data-accent', accent || 'perf');
      clusterEl.innerHTML = '';
      const rows = Array.isArray(nav.rows) ? nav.rows : [];
      // Always paint 5 slots so the hanging band height stays locked.
      for (let i = 0; i < 5; i++) {
        const c = rows[i] || { type: 'empty' };
        if (c.type === 'pager') {
          const wrap = document.createElement('div');
          wrap.className = 'pager';
          const prev = document.createElement('button');
          prev.type = 'button';
          prev.textContent = '‹';
          prev.disabled = !!c.prevDisabled;
          prev.setAttribute('aria-label', 'Previous page');
          prev.addEventListener('click', (ev) => {
            ev.preventDefault();
            if (prev.disabled) return;
            const ipc = lotusIpc();
            if (ipc?.send) ipc.send('atrium-shell-button', 'nav:prev');
          });
          const next = document.createElement('button');
          next.type = 'button';
          next.textContent = '›';
          next.disabled = !!c.nextDisabled;
          next.setAttribute('aria-label', 'Next page');
          next.addEventListener('click', (ev) => {
            ev.preventDefault();
            if (next.disabled) return;
            const ipc = lotusIpc();
            if (ipc?.send) ipc.send('atrium-shell-button', 'nav:next');
          });
          wrap.appendChild(prev);
          wrap.appendChild(next);
          clusterEl.appendChild(wrap);
          continue;
        }

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'row';
        if (c.type === 'empty') {
          btn.classList.add('empty');
          btn.tabIndex = -1;
          btn.disabled = true;
        } else if (c.type === 'plugin') {
          if (c.active) btn.classList.add('active');
          const ic = document.createElement('span');
          ic.className = 'icon';
          ic.textContent = c.icon || iconFor(c.label);
          const lb = document.createElement('span');
          lb.className = 'label';
          lb.textContent = c.label || c.key || '';
          btn.appendChild(ic);
          btn.appendChild(lb);
          btn.addEventListener('click', (ev) => {
            ev.preventDefault();
            const ipc = lotusIpc();
            if (ipc?.send && c.key) ipc.send('atrium-shell-button', 'dock:' + c.key);
          });
        }
        clusterEl.appendChild(btn);
      }
    }

    function onShellChrome(d) {
      d = d || {};
      if (d.mode) mode = d.mode;
      if (d.nav) nav = d.nav;
      if (d.accent) accent = d.accent;
      render();
    }
    window.addEventListener('atrium-shell-chrome', (e) => onShellChrome(e.detail));
    const eventSource = window.lotus?.on
      ? window.lotus
      : window.lotus?.ipc?.on
        ? window.lotus.ipc
        : null;
    if (eventSource) eventSource.on('atrium-shell-chrome', onShellChrome);
    render();
  </script>
</body>
</html>
